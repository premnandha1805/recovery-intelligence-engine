services:
  postgres-test:
    image: postgres:17
    container_name: recovery-intelligence-postgres-test
    environment:
      POSTGRES_DB: recovery_test
      POSTGRES_USER: recovery_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery_test -d recovery_test"]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - recovery_test_pgdata:/var/lib/postgresql/data

volumes:
  recovery_test_pgdata:
